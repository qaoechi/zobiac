<th:block th:fragment="head(main)">
    <th:block th:switch="${main}">
        <th:block th:case="buildings">
            <link th:href="@{/css/buildings.css}" rel="stylesheet">
        </th:block>
        <th:block th:case="dashboard">
            <link th:href="@{/css/classroom.css}" rel="stylesheet">
        </th:block>
        <th:block th:case="profile">
            <link th:href="@{/css/classroom.css}" rel="stylesheet">
        </th:block>
        <th:block th:case="schedule">
            <link th:href="@{/css/schedule.css}" rel="stylesheet">
        </th:block>
        <th:block th:case="editor">
            <link th:href="@{/css/editor.css}" rel="stylesheet">
        </th:block>
    </th:block>
</th:block>
