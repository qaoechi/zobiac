<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <title>점자리</title>
        <link rel="stylesheet" th:href="@{/css/base/base.css}">
        <link rel="stylesheet" th:href="@{/css/base/variable.css}">
        <link rel="stylesheet" th:href="@{/css/layout/layout.css}">
        <link rel="stylesheet" th:href="@{/css/layout/header.css}">
        <th:block layout:fragment="style"></th:block>
    </head>
    <body>
        <header>
            <th:block th:replace="~{fragments/header/header :: header}"></th:block>
        </header>
        <main>
            <div layout:fragment="content"></div>
        </main>
        <footer>
            <th:block th:replace="~{fragments/footer :: footer}"></th:block>
        </footer>
        <th:block layout:fragment="javascript"></th:block>
    </body>
</html>
