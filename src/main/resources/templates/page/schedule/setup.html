<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/main}">
    <head>
        <th:block th:replace="~{fragments/csrf-token :: csrf-token}"></th:block>
        <th:block>
            <link rel="stylesheet" th:href="@{/css/page/schedule/setup.css}">
        </th:block>
    </head>
    <body>
        <th:block layout:fragment="content">
            <table id="time-table">
                <thead>
                    <tr>
                        <th>schedule</th>
                        <th>Sun</th>
                        <th>Mon</th>
                        <th>Tue</th>
                        <th>Wed</th>
                        <th>Thu</th>
                        <th>Fri</th>
                        <th>Sat</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
            <button onclick="submitSchedule()">저장</button>
            <script type="application/json" id="schedule-data" th:inline="javascript">
                {
                    "meetingId": [[${meetingId}]],
                    "avails": [[${avails}]]
                }
            </script>
            <script th:src="@{/js/schedule-data.js}" defer></script>
            <script th:src="@{/js/schedule-slot.js}" defer></script>
            <script th:src="@{/js/schedule-submit.js}" defer></script>
        </th:block>
    </body>
</html>
