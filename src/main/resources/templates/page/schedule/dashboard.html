<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/main}">
    <head>
        <th:block layout:fragment="style">
            <link rel="stylesheet" th:href="@{/css/page/schedule/dashboard.css}">
        </th:block>
    </head>
    <body>
        <th:block layout:fragment="content">
            <th:block th:each="meeting : ${meetings}">
                <div th:text="${meeting.id}"></div>
                <a th:href="@{'/client/schedule/' + ${meeting.id}}" th:text="${meeting.title}"></a>
            </th:block>
            <button sec:authorize="hasRole('MANAGER')"
                th:onclick="|location.href='@{/manager/schedule}'|">
                manager
            </button>
        </th:block>
    </body>
</html>
