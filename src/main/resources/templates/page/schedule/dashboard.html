<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/main}">
    <head>
        <th:block layout:fragment="style">
            <link rel="stylesheet" th:href="@{/css/page/schedule/dashboard.css}">
        </th:block>
    </head>
    <body>
        <th:block layout:fragment="content">
            <th:block th:each="meeting : ${meetings}">
                <a th:href="@{'/client/schedule/' + ${meeting.id}}" th:text="${meeting.title}"></a>
            </th:block>
            <th:block sec:authorize="hasRole('MANAGER')">
                <button th:onclick="|location.href='@{/manager/schedule}'|">
                    meeting manage
                </button>
                <button th:onclick="|location.href='@{/manager/schedule/consolidation}'|">
                    calc time
                </button>
            </th:block>

        </th:block>
    </body>
</html>
